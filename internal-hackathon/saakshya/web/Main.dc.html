<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; font-family: "Chivo", system-ui, sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    a { color: #e8f3ec; } a:hover { color: #ffffff; }
  </style>
</helmet>

<div style="width:1280px; height:820px; position:relative; overflow:hidden; background:#020309;">

  <!-- full-bleed India-at-night -->
  <img src="nighthero.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
  <!-- subtle top+center darken for legibility -->
  <div style="position:absolute; inset:0; background:radial-gradient(60% 46% at 50% 52%, rgba(2,4,12,.35), rgba(2,4,12,0) 70%);"></div>

  <!-- navbar -->
  <div style="position:absolute; top:0; left:0; right:0; height:64px; display:flex; align-items:center; padding:0 34px; gap:20px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f0c552" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3q5 5 0 18M12 3q-5 5 0 18"/></svg>
      <span class="mono" style="color:#f2f6f3; font-size:14px; letter-spacing:3px;">SAAKSHYA</span>
    </div>
    <div style="flex-grow:1;"></div>
    <div class="mono" style="display:flex; gap:28px; font-size:12px; color:#cdd6d0; letter-spacing:1px;">
      <span>ABOUT</span><span>PROBLEM</span><span>ATLAS</span>
    </div>
    <div class="mono" style="border:1px solid rgba(240,197,82,.5); color:#f0c552; font-size:12px; letter-spacing:1px; padding:8px 16px; border-radius:3px;">SIGN IN</div>
  </div>

  <!-- wordmark -->
  <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <div style="font-weight:300; font-size:150px; letter-spacing:26px; color:#ffffff; text-shadow:0 10px 50px rgba(0,0,0,.7); padding-left:26px;">Saakshya</div>
    <div class="mono" style="margin-top:10px; font-size:14px; letter-spacing:6px; color:#e6ede8; text-transform:uppercase; text-shadow:0 2px 14px rgba(0,0,0,.85);">Evidence for the claims that were rejected</div>
  </div>

  <!-- bottom sign-in -->
  <div style="position:absolute; left:0; right:0; bottom:0; height:104px; display:flex; align-items:center; justify-content:center; gap:20px;">
    <button style="border:none; background:#f0c552; color:#20180a; font-weight:700; font-size:15px; padding:14px 34px; border-radius:5px; letter-spacing:.5px; cursor:pointer; box-shadow:0 0 34px rgba(240,197,82,.45);">Sign in</button>
    <button class="mono" style="border:1px solid rgba(230,237,232,.4); background:rgba(2,4,12,.4); color:#e6ede8; font-size:13px; padding:14px 30px; border-radius:5px; letter-spacing:1px; cursor:pointer;">LOGIN</button>
  </div>

</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
